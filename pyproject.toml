[project]
name = "compression"
version = "0.1.0"
description = "Local EVE Online compressed-ore purchase-list optimizer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # pulp 4 no longer bundles CBC (the [cbc] extra provides it) and imports numpy
    # without declaring it as a dependency.
    "pulp[cbc]>=4.2",
    "numpy>=2",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[tool.uv]
package = false
